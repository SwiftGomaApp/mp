    directory: /apps/docs
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/mobile-buyer
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/mobile-seller
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/mobile-rider
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
