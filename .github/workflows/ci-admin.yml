name: CI - Admin app

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/ci-admin.yml"
  push:
    branches: [dev, main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/ci-admin.yml"

concurrency:
  group: ci-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_ORIGIN: http://localhost:4000
