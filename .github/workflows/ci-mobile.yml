name: CI - Mobile apps

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/mobile-buyer/**"
      - "apps/mobile-seller/**"
      - "apps/mobile-rider/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches: [dev, main]
    paths:
      - "apps/mobile-buyer/**"
      - "apps/mobile-seller/**"
      - "apps/mobile-rider/**"

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-buyer, mobile-seller, mobile-rider]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - name: Check Expo config and dependencies
        run: npx expo-doctor
        continue-on-error: true
