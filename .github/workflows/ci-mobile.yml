name: CI - Mobile apps

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    paths:
      - "apps/mobile-buyer/**"
      - "apps/mobile-seller/**"
      - "apps/mobile-rider/**"

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-buyer, mobile-seller, mobile-rider]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip notice
        if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) == ''
        run: echo "apps/${{ matrix.app }}/package-lock.json not found yet, skipping."
        working-directory: .

      - uses: actions/setup-node@v4
        if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) != ''
        run: npm ci
      - if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) != ''
        run: npm run lint
      - if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) != ''
        run: npm test --if-present
      - name: Check Expo config and dependencies
        if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) != ''
        run: npx expo-doctor
        continue-on-error: true
