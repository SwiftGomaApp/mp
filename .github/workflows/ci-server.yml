name: CI - Server

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    paths:
      - "server/**"

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: swiftgoma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/swiftgoma_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      QR_HMAC_SECRET: ci-qr-secret
      SECRETS_PROVIDER: dotenv
      API_BASE_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Skip notice
        if: hashFiles('server/package-lock.json') == ''
        run: echo "server/package-lock.json not found yet, skipping."
        working-directory: .

      - uses: actions/setup-node@v4
        if: hashFiles('server/package-lock.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - if: hashFiles('server/package-lock.json') != ''
        run: npm ci
      - if: hashFiles('server/package-lock.json') != ''
        run: npx prisma generate
      - if: hashFiles('server/package-lock.json') != ''
        run: npx prisma migrate deploy
      - if: hashFiles('server/package-lock.json') != ''
        run: npm run lint
      - if: hashFiles('server/package-lock.json') != ''
        run: npm test
