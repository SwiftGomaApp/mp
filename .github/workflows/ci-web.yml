name: CI - Web apps

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/web-buyer/**"
      - "apps/admin/**"
      - "apps/docs/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [dev, main]
    paths:
      - "apps/web-buyer/**"
      - "apps/admin/**"
      - "apps/docs/**"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web-buyer, admin, docs]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
