name: CI - Web apps

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    paths:
      - "apps/web-buyer/**"
      - "apps/admin/**"
      - "apps/docs/**"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web-buyer, admin, docs]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip notice
        if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) == ''
        run: echo "apps/${{ matrix.app }}/package-lock.json not found yet, skipping."
        working-directory: .

      - uses: actions/setup-node@v4
        if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) != ''
        run: npm ci
      - if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) != ''
        run: npm run lint
      - if: hashFiles(format('apps/{0}/package-lock.json', matrix.app)) != ''
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
