name: PR target check

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Only dev or hotfix/* may target main
        run: |
          SRC="${{ github.head_ref }}"
          if [ "$SRC" != "dev" ] && [[ "$SRC" != hotfix/* ]]; then
            echo "::error::PRs into main must come from 'dev' or 'hotfix/*' (got '$SRC')."
            exit 1
          fi
